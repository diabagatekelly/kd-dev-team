name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Unit tests
        shell: bash
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          for d in library briefs judge startup research steps/03-requirements/eval steps/04-research/eval e2e; do (cd "$d" && "$py" -I -m unittest -q) || exit 1; done
