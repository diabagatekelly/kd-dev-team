schema_version: "1.1"
name: startup-20-the-folder-named
description: "The user names the planning folder: record it by the report's command; the problem is next."
tags: [startup]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: "A folder called planning is fine."
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
runs: 3
graders:
  - {"type": "tool_used", "name": "records-the-folder", "tool": "Bash", "min": 1, "input_match": "remember\\s+\\\\?[\\\"']?planning"}
  - {"type": "regex", "name": "the-problem-is-next", "target": "last_message", "flags": "i", "pattern": "problem"}
  - {"type": "regex", "name": "suggests-nothing-of-the-product", "target": "last_message", "flags": "i", "pattern": "\\b(could|might|may) (mean|cover|include)\\b|such as (a |an )?(booking|list|rota|calendar)", "match": "not_contains"}
  - {"type": "tool_used", "name": "installs-nothing", "tool": "Bash", "input_match": "brew\\s+(trust|install)|winget\\s+install|get\\.docker\\.com|apt(-get)?\\s+install|machine\\.sh\\\\?\\\"?\\s+install", "min": 0, "max": 0}
  - {"type": "tool_used", "name": "writes-no-file", "tool": "Write", "min": 0, "max": 0}
  - {"type": "tool_used", "name": "edits-no-file", "tool": "Edit", "min": 0, "max": 0}
  - {"type": "tool_used", "name": "builds-nothing-by-shell", "tool": "Bash", "input_match": "\\b(mkdir(?![^;&|]*(TMPDIR|/tmp))|touch|npm|npx|pnpm|yarn|pip3?|cargo|git\\s+(init|add|commit|checkout\\s+-b|switch\\s+-c))\\b|>\\s*[\\w./~-]+\\.\\w+", "min": 0, "max": 0}
  - {"type": "tool_used", "name": "leaves-sign-in-to-the-user", "tool": "Bash", "input_match": "sbx\\s+login|gh\\s+auth\\s+login", "min": 0, "max": 0}
  - {"type": "tool_used", "name": "merges-nothing", "tool": "Bash", "input_match": "gh\\s+pr\\s+merge|git\\s+merge", "min": 0, "max": 0}
  - {"type": "regex", "name": "keeps-row-numbers-out", "target": "last_message", "flags": "i", "pattern": "\\brows? \\d|\\brouting table\\b", "match": "not_contains"}
